name: Test
on:
  pull_request:
  push: { branches: main }
  workflow_dispatch:
permissions: { contents: read }

jobs:
  test:
    uses: nodenv/.github/.github/workflows/test.yml@v7
    with: { superlinter: false } # TODO renable superlinter
    permissions:
      contents: read
      packages: read
      id-token: write
      security-events: write
      statuses: write

  superlinter:
    runs-on: ubuntu-latest
    if: github.ref_name != github.event.repository.default_branch
    permissions: { statuses: write }
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with: { fetch-depth: 0 } # super-linter needs full git history
      - uses: github/super-linter/slim@b807e99ddd37e444d189cfd2c2ca1274d8ae8ef1 # v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASH_EXEC_IGNORE_LIBRARIES: true
          FILTER_REGEX_EXCLUDE: ".*stub.*"
